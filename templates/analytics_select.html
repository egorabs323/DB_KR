{% extends 'base.html' %}

{% block title %}Выбор Аналитики{% endblock %}
{% block nav_top_left %}
    <div class="nav-top-left">
        <a href="{% url 'main_menu' %}">Вернуться в меню</a>
    </div>
{% endblock %}
{% block content %}

<style>
    .form-control {
        font-size: 0.9rem;
        padding: 0.5rem 0.75rem;
        width: 100%;
        max-width: 180px;
        box-sizing: border-box;
    }
    .form-label {
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
        display: block;
    }
    .date-fields-container {
        display: flex;
        gap: 15px;
        align-items: flex-end;
        flex-wrap: wrap;
    }
    .date-field-wrapper {
        display: flex;
        flex-direction: column;
    }
    .btn-submit {
        background-color: #ffd700;
        color: #121212;
        padding: 10px 20px;
        border-radius: 4px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }
    .btn-submit:hover {
        opacity: 0.85;
    }
</style>

<div class="container-fluid">
    <h2 class="mt-3 mb-4">Выбор типа аналитики</h2>

    <div class="card mb-4">
        <div class="card-header">
            <h5>Фильтры и тип отчета</h5>
        </div>
        <div class="card-body">
            <form method="get" action="{% url 'analytics_generate' %}">
                <div class="mb-3">
                    <label for="type" class="form-label">Тип аналитики</label>
                    <select class="form-control" id="type" name="type" required>
                        <option value="">-- Выберите тип --</option>
                        {% for key, label in available_analytics %}
                            {% if key == 'requests_by_date' and permissions.can_view_requests %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% elif key == 'estimates_by_date' and permissions.can_view_estimates %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% elif key == 'top_materials_used' and permissions.can_view_estimates and permissions.can_view_materials %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% elif key == 'employees_hired_by_date' and permissions.can_view_employment_records %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% elif key == 'employees_by_department' and permissions.can_view_employment_records and permissions.can_view_departments %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% elif key == 'supplies_by_date' and permissions.can_view_supplies %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% elif key == 'tasks_by_date' and permissions.can_view_tasks %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% elif key == 'contracts_by_construction_management' and permissions.can_view_contracts and permissions.can_view_construction_managements %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% elif key == 'sites_by_city' and permissions.can_view_construction_sites and permissions.can_view_cities %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% elif key == 'crew_sizes' and permissions.can_view_crews %}
                                <option value="{{ key }}" {% if selected_type == key %}selected{% endif %}>{{ label }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>

                <!-- Даты в одной строке -->
                <div class="date-fields-container">
                    <div class="date-field-wrapper">
                        <label for="date_from" class="form-label">Дата от</label>
                        <input type="date" class="form-control" id="date_from" name="date_from" value="{{ filter_date_from }}">
                    </div>
                    <div class="date-field-wrapper">
                        <label for="date_to" class="form-label">Дата до</label>
                        <input type="date" class="form-control" id="date_to" name="date_to" value="{{ filter_date_to }}">
                    </div>
                </div>

                <button type="submit" class="btn-submit">Сформировать график</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
